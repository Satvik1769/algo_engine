[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-engine"
version = "0.1.0"
description = "Python event-driven algorithmic trading backtesting engine"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["algo_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
